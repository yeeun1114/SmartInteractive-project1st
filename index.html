<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trainspotting</title>
  <style>
    :root{--orange:#d94b16;--black:#111;--paper:#fff;--line:#111;--pad:clamp(20px,4.2vw,64px)}
    .theme-panel{position:fixed;right:var(--pad);bottom:24px;z-index:10;justify-content:flex-end;margin:0;padding:0;border:0;background:transparent}.theme-label{display:none}.theme-switch{width:24px;height:14px;padding:0;border:0;outline:0;box-shadow:none;appearance:none;background:#111}.theme-switch::before{top:2px;left:2px;width:10px;height:10px;border:0;box-shadow:none}.dark-theme .theme-switch::before{transform:translateX(10px)}.theme-switch:focus-visible{outline:0;box-shadow:none}
    html{transition:background-color .3s ease-out,color .3s ease-out}html.dark-theme{--paper:#111;--black:#fff}.nav a{position:relative;display:inline-block;width:max-content;max-width:100%}.nav a::after{position:absolute;right:8px;bottom:7px;left:0;height:2px;background:var(--orange);content:"";transform:scaleX(0);transform-origin:left;transition:transform .2s ease-out}.nav a:hover::after,.nav a:focus-visible::after{transform:scaleX(1)}.nav a:not(:hover):not(:focus-visible)::after{transform-origin:right;transition-duration:.3s}.theme-panel{display:flex;width:max-content;max-width:100%;align-items:center;gap:16px;margin-top:34px;padding:14px 18px;border:2px solid #111;background:#fff;color:#111}.theme-label{margin:0;font-size:14px;font-weight:700}.theme-switch{position:relative;width:48px;height:28px;flex:none;padding:2px;border:0;background:#111;cursor:pointer}.theme-switch::before{position:absolute;top:2px;left:2px;width:24px;height:24px;background:var(--orange);content:"";transition:transform .3s ease-out}.dark-theme .theme-switch::before{transform:translateX(22px)}.theme-switch:focus-visible{outline:2px solid var(--orange);outline-offset:4px}
    html .wrap .theme-panel{position:fixed;right:var(--pad);bottom:24px;z-index:10;justify-content:flex-end;margin:0;padding:0;border:0;background:transparent}html .theme-panel .theme-label{display:none}html .theme-panel .theme-switch{width:24px;height:14px;padding:0;border:0;outline:0;box-shadow:none;appearance:none;background:#111}html .theme-panel .theme-switch::before{top:2px;left:2px;width:10px;height:10px;border:0;box-shadow:none}html.dark-theme .theme-panel .theme-switch::before{transform:translateX(10px)}html .theme-panel .theme-switch:focus-visible{outline:0;box-shadow:none}
    *{box-sizing:border-box;transition:color .3s ease-out,background-color .3s ease-out,border-color .3s ease-out}html{background:var(--paper);color:var(--black);font-family:Helvetica,Arial,sans-serif}body{margin:0;min-width:0}.site-header{padding:22px var(--pad) 0}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--black);border-bottom:1px solid var(--black)}.nav a{padding:14px 8px 13px 0;color:var(--black);font-size:14px;font-weight:700;text-decoration:none;letter-spacing:.02em}.nav a[aria-current=page]{color:var(--orange)}.nav a:focus-visible{outline:2px solid var(--orange);outline-offset:3px}.wrap{padding:clamp(50px,11vw,160px) var(--pad) 72px}.hero{position:relative;min-height:64vh;display:flex;align-items:center;border-bottom:2px solid var(--black);overflow:visible}.hero-title{position:relative;top:-16px;margin:0;color:var(--orange);font-size:clamp(64px,17vw,240px);line-height:.78;letter-spacing:-.085em;font-weight:900;white-space:nowrap;will-change:transform}.intro{max-width:980px;margin:38px 0 0;color:var(--orange);font-size:clamp(18px,2.2vw,30px);line-height:1.35;font-weight:700;filter:blur(8px);transition:filter .2s ease-out}.intro:hover{filter:blur(0)}
    .hero-backdrop{position:absolute;inset:0;overflow:hidden;pointer-events:none}.hero-backdrop img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;filter:blur(2px)}.hero-title{z-index:1}
    @media(max-width:600px){.site-header{padding-top:16px}.nav a{font-size:12px}.wrap{padding-top:100px}.hero{min-height:50vh}.hero-title{top:-10px;font-size:clamp(54px,16vw,100px);white-space:normal;overflow-wrap:anywhere;line-height:.88}.intro{margin-top:25px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}.hero-title{transform:none!important}.intro{filter:none}}
  </style>
</head>
<body>
  <header class="site-header"><nav class="nav" aria-label="페이지 메뉴"><a href="index.html" aria-current="page">Trainspotting</a><a href="detail.html">Quotes</a><a href="about.html">Made</a></nav></header>
  <main class="wrap">
    <section class="hero" id="hero"><div class="hero-backdrop" aria-hidden="true"><img src="0_bacRnmAYlPyf9eWi.jpg" alt="" draggable="false"></div><h1 class="hero-title" id="title">Trainspotting</h1></section>
    <p class="intro">Trainspotting은 1980년대 영국 속어로 별로 중요하지 않고 생산성 없는 사소한 주제나 일에 푹 빠져 집착하는 것(뻘짓)을 뜻하기도 합니다.</p>
    <section class="theme-panel" aria-label="테마"><button class="theme-switch" id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="테마 전환"></button></section>
  </main>
  <script>
    const hero=document.getElementById('hero'),title=document.getElementById('title');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)'),toggle=document.getElementById('theme-switch');
    let theme=new URLSearchParams(location.search).get('theme');try{if(!theme)theme=localStorage.getItem('trainspotting-theme')}catch{}theme=theme==='dark'?'dark':'light';
    function setTheme(next){theme=next;document.documentElement.classList.toggle('dark-theme',theme==='dark');toggle.setAttribute('aria-checked',String(theme==='dark'));try{localStorage.setItem('trainspotting-theme',theme)}catch{}document.querySelectorAll('.nav a').forEach(a=>{const u=new URL(a.href);if(theme==='dark')u.searchParams.set('theme','dark');else u.searchParams.delete('theme');a.href=u.pathname.split('/').pop()+u.search})}
    setTheme(theme);toggle.addEventListener('click',()=>setTheme(theme==='dark'?'light':'dark'));
    const card=document.querySelector('.wrap');let baseTitle,baseCard;
    function measureInteraction(){baseTitle=title.getBoundingClientRect();baseCard=card.getBoundingClientRect()}
    function resetTitle(){title.style.transition='transform .3s ease-out';title.style.transform='translate(0,0)'}
    measureInteraction();addEventListener('resize',measureInteraction);
    card.addEventListener('pointermove',e=>{if(reduced.matches)return;const left=Math.max(baseCard.left,baseTitle.left-80),right=Math.min(baseCard.right,baseTitle.right+80),top=Math.max(baseCard.top,baseTitle.top-80),bottom=Math.min(baseCard.bottom,baseTitle.bottom+80);if(e.clientX<left||e.clientX>right||e.clientY<top||e.clientY>bottom){resetTitle();return}const x=e.clientX-(baseTitle.left+baseTitle.width/2),y=e.clientY-(baseTitle.top+baseTitle.height/2);title.style.transition='transform .2s ease-out';title.style.transform=`translate(${Math.max(-20,Math.min(20,x/153*20))}px,${Math.max(-20,Math.min(20,y/104*20))}px)`});
    card.addEventListener('pointerleave',resetTitle);
  </script>
</body>
</html>
